<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "DM Sans", sans-serif;
      transition: background 0.8s ease, color 0.8s ease;
    }

    body.light {
      background: #ffffff;
      color: #191919;
    }

    body.dark {
      background: #191919;
      color: #ffffff;
    }

    #themeToggle {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: transparent;
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    body:hover #themeToggle {
      opacity: 0.72;
      pointer-events: auto;
    }

    body:hover #themeToggle:hover {
      opacity: 1;
      transform: scale(1.06);
    }

    #themeToggle::before {
      content: "";
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1px solid currentColor;
      background:
        radial-gradient(circle at 50% 25%, #191919 0 1.4px, transparent 1.6px),
        radial-gradient(circle at 50% 75%, #ffffff 0 1.4px, transparent 1.6px),
        radial-gradient(circle at 50% 25%, #ffffff 0 3.25px, transparent 3.45px),
        radial-gradient(circle at 50% 75%, #191919 0 3.25px, transparent 3.45px),
        linear-gradient(90deg, #ffffff 0 50%, #191919 50% 100%);
      box-shadow: 0 0 0 1px rgba(128, 128, 128, 0.25);
      transition: transform 0.45s ease, box-shadow 0.45s ease;
    }

    body.dark #themeToggle::before {
      transform: rotate(180deg);
    }

    #wordTime {
      width: min(86vw, 900px);
      text-align: center;
      font-size: clamp(22px, 4.4vw, 56px);
      line-height: 1.5;
      font-weight: 200;
      letter-spacing: -0.055em;
    }

    .word {
      display: inline-block;
    }

    .strong {
      font-weight: 600;
    }

    .changed {
      animation: slideUp 0.95s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(0.45em);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <button id="themeToggle" aria-label="Switch theme"></button>
  <main id="wordTime"></main>

  <script>
    const wordTimeEl = document.getElementById("wordTime");
    const themeToggle = document.getElementById("themeToggle");

    const numberWords = {
      1: "one",
      2: "two",
      3: "three",
      4: "four",
      5: "five",
      6: "six",
      7: "seven",
      8: "eight",
      9: "nine",
      10: "ten",
      11: "eleven",
      12: "twelve",
      13: "thirteen",
      14: "fourteen",
      15: "fifteen",
      16: "sixteen",
      17: "seventeen",
      18: "eighteen",
      19: "nineteen",
      20: "twenty",
      21: "twenty-one",
      22: "twenty-two",
      23: "twenty-three",
      24: "twenty-four",
      25: "twenty-five",
      26: "twenty-six",
      27: "twenty-seven",
      28: "twenty-eight",
      29: "twenty-nine"
    };

    function to12Hour(hour24) {
      const hour = hour24 % 12;
      return hour === 0 ? 12 : hour;
    }

    function next12Hour(hour24) {
      return to12Hour(hour24 + 1);
    }

    function minuteUnit(value) {
      return value === 1 ? "minute" : "minutes";
    }

    function timeToParts(hour24, minute) {
      const currentHour = numberWords[to12Hour(hour24)];
      const nextHour = numberWords[next12Hour(hour24)];

      if (minute === 0) {
        return [
          { text: currentHour, strong: true },
          { text: "o'clock", strong: false }
        ];
      }

      if (minute === 15) {
        return [
          { text: "quarter", strong: true },
          { text: "past", strong: false },
          { text: currentHour, strong: true }
        ];
      }

      if (minute === 30) {
        return [
          { text: "half", strong: true },
          { text: "past", strong: false },
          { text: currentHour, strong: true }
        ];
      }

      if (minute === 45) {
        return [
          { text: "quarter", strong: true },
          { text: "to", strong: false },
          { text: nextHour, strong: true }
        ];
      }

      if (minute < 30) {
        return [
          { text: numberWords[minute], strong: true },
          { text: minuteUnit(minute), strong: false },
          { text: "past", strong: false },
          { text: currentHour, strong: true }
        ];
      }

      const minutesToNextHour = 60 - minute;
      return [
        { text: numberWords[minutesToNextHour], strong: true },
        { text: minuteUnit(minutesToNextHour), strong: false },
        { text: "to", strong: false },
        { text: nextHour, strong: true }
      ];
    }

    function renderParts(parts, previousParts) {
      return parts.map((part, index) => {
        const previous = previousParts[index];
        const hasChanged = !previous || previous.text !== part.text;
        const classes = ["word"];

        if (part.strong) classes.push("strong");
        if (hasChanged) classes.push("changed");

        return `<span class="${classes.join(" ")}">${part.text}</span>`;
      }).join(" ");
    }

    function defaultThemeByTime() {
      const hour = new Date().getHours();
      return hour >= 6 && hour < 18 ? "light" : "dark";
    }

    function applyTheme(theme) {
      document.body.className = theme;
      themeToggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
    }

    function getInitialTheme() {
      return localStorage.getItem("wordClockTheme") || defaultThemeByTime();
    }

    themeToggle.addEventListener("click", () => {
      const nextTheme = document.body.classList.contains("dark") ? "light" : "dark";
      localStorage.setItem("wordClockTheme", nextTheme);
      applyTheme(nextTheme);
    });

    let previousParts = [];

    function updateClock() {
      const now = new Date();
      const parts = timeToParts(now.getHours(), now.getMinutes());
      const oldText = previousParts.map(part => part.text).join(" ");
      const newText = parts.map(part => part.text).join(" ");

      if (newText !== oldText) {
        wordTimeEl.innerHTML = renderParts(parts, previousParts);
        previousParts = parts;
      }
    }

    applyTheme(getInitialTheme());
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>

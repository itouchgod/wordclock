<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "DM Sans", sans-serif;
      transition: background 1.2s ease, color 1.2s ease;
    }

    body.day {
      background: #ffffff;
      color: #191919;
    }

    body.night {
      background: #191919;
      color: #ffffff;
    }

    #wordTime {
      width: min(86vw, 900px);
      text-align: center;
      font-size: clamp(28px, 5.6vw, 72px);
      line-height: 1.5;
      font-weight: 200;
      letter-spacing: -0.055em;
    }

    .word {
      display: inline-block;
    }

    .strong {
      font-weight: 600;
    }

    .changed {
      animation: slideUp 0.95s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(0.45em);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main id="wordTime"></main>

  <script>
    const wordTimeEl = document.getElementById("wordTime");

    const numberWords = {
      1: "one",
      2: "two",
      3: "three",
      4: "four",
      5: "five",
      6: "six",
      7: "seven",
      8: "eight",
      9: "nine",
      10: "ten",
      11: "eleven",
      12: "twelve",
      13: "thirteen",
      14: "fourteen",
      15: "fifteen",
      16: "sixteen",
      17: "seventeen",
      18: "eighteen",
      19: "nineteen",
      20: "twenty",
      21: "twenty-one",
      22: "twenty-two",
      23: "twenty-three",
      24: "twenty-four",
      25: "twenty-five",
      26: "twenty-six",
      27: "twenty-seven",
      28: "twenty-eight",
      29: "twenty-nine"
    };

    function to12Hour(hour24) {
      const hour = hour24 % 12;
      return hour === 0 ? 12 : hour;
    }

    function next12Hour(hour24) {
      return to12Hour(hour24 + 1);
    }

    function minuteUnit(value) {
      return value === 1 ? "minute" : "minutes";
    }

    function timeToParts(hour24, minute) {
      const currentHour = numberWords[to12Hour(hour24)];
      const nextHour = numberWords[next12Hour(hour24)];

      if (minute === 0) {
        return [
          { text: currentHour, strong: true },
          { text: "o'clock", strong: false }
        ];
      }

      if (minute === 15) {
        return [
          { text: "quarter", strong: true },
          { text: "past", strong: false },
          { text: currentHour, strong: true }
        ];
      }

      if (minute === 30) {
        return [
          { text: "half", strong: true },
          { text: "past", strong: false },
          { text: currentHour, strong: true }
        ];
      }

      if (minute === 45) {
        return [
          { text: "quarter", strong: true },
          { text: "to", strong: false },
          { text: nextHour, strong: true }
        ];
      }

      if (minute < 30) {
        return [
          { text: numberWords[minute], strong: true },
          { text: minuteUnit(minute), strong: false },
          { text: "past", strong: false },
          { text: currentHour, strong: true }
        ];
      }

      const minutesToNextHour = 60 - minute;
      return [
        { text: numberWords[minutesToNextHour], strong: true },
        { text: minuteUnit(minutesToNextHour), strong: false },
        { text: "to", strong: false },
        { text: nextHour, strong: true }
      ];
    }

    function renderParts(parts, previousParts) {
      return parts.map((part, index) => {
        const previous = previousParts[index];
        const hasChanged = !previous || previous.text !== part.text;
        const classes = ["word"];

        if (part.strong) classes.push("strong");
        if (hasChanged) classes.push("changed");

        return `<span class="${classes.join(" ")}">${part.text}</span>`;
      }).join(" ");
    }

    function updateTheme(hour) {
      const isDaytime = hour >= 6 && hour < 18;
      document.body.className = isDaytime ? "day" : "night";
    }

    let previousParts = [];

    function updateClock() {
      const now = new Date();
      const parts = timeToParts(now.getHours(), now.getMinutes());
      const oldText = previousParts.map(part => part.text).join(" ");
      const newText = parts.map(part => part.text).join(" ");

      updateTheme(now.getHours());

      if (newText !== oldText) {
        wordTimeEl.innerHTML = renderParts(parts, previousParts);
        previousParts = parts;
      }
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
